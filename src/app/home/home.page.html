<ion-header>
  <ion-toolbar>
    <img
      src="assets/logo2black.svg"
      alt="Real Estate Care"
      class="header-logo"
    />

    <div slot="end" class="notification-button">
      <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
      <ion-badge color="danger">2</ion-badge>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="dashboard">
    <section class="welcome">
      <p class="eyebrow">Dashboard</p>
      <h1>Goedemorgen</h1>
      <p>Wat wilt u vandaag doen?</p>
    </section>

    <section aria-label="Hoofdfuncties">
      <ion-grid class="dashboard-cards">
        <ion-row>
          <ion-col size="6">
            <app-dashboard-card
              title="Toegewezen rapportages"
              description="Openstaande inspecties"
              icon="clipboard-outline"
              [badge]="3"
              (cardSelected)="openFeature('Toegewezen rapportages')"
            ></app-dashboard-card>
          </ion-col>

          <ion-col size="6">
            <app-dashboard-card
              title="Uitgevoerde rapportages"
              description="Inzien en aanpassen"
              icon="checkmark-circle-outline"
              (cardSelected)="openFeature('Uitgevoerde rapportages')"
            ></app-dashboard-card>
          </ion-col>

          <ion-col size="6">
            <app-dashboard-card
              title="Kennisbank"
              description="Normbladen en procedures"
              icon="book-outline"
              (cardSelected)="openFeature('Kennisbank')"
            ></app-dashboard-card>
          </ion-col>

          <ion-col size="6">
            <app-dashboard-card
              title="Instellingen"
              description="Account en voorkeuren"
              icon="settings-outline"
              (cardSelected)="openFeature('Instellingen')"
            ></app-dashboard-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>
  </main>
</ion-content>

<ion-tab-bar slot="bottom">
  <ion-tab-button tab="dashboard" selected>
    <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
    <ion-label>Dashboard</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="rapportages">
    <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
    <ion-label>Rapportages</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="kennisbank">
    <ion-icon name="book-outline" aria-hidden="true"></ion-icon>
    <ion-label>Kennisbank</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="instellingen">
    <ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
    <ion-label>Instellingen</ion-label>
  </ion-tab-button>
</ion-tab-bar>
